#!/bin/sh
# cinit rc.conf — сервисы и политики рестарта (аналог systemd-юнитов)
#
# SERVICES: список запускаемых сервисов (порядок = порядок запуска)
# <name>_restart: политика перезапуска при завершении процесса:
#   always  — перезапускать всегда, даже при чистом exit 0
#   onfail  — перезапускать только при сбое (exit != 0) [default]
#   once    — не перезапускать никогда
#
# Журнал: /var/log/cinit/<name>.log
# Управление: cinitctl status|start|stop|restart|log|enable|disable
SERVICES="mounts hostname udevd dbus seatd network tty"

# демоны-долгожители — всегда держать живыми
sshd_restart=always
nginx_restart=always
crond_restart=always

# одноразовые моунты — не перезапускать
mounts_restart=once
hostname_restart=once